<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ПАДЕЖНЫЙ КВЕСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d9f0ff; --bg2:#bfe3fa; --ink:#0a2447; --muted:#27497a; --card:#ffffff; --edge:#8fbbe3;
  --good:#6eeab4; --bad:#ffcfdc; --warn:#ffe27a; --accent:#3aa0ff; --on:#0a2447;
  --l1:#8cc8ff; --l2:#7fe3c4; --l3:#ffe27a; --l4:#ffb877; --l5:#ff9fb4; --l6:#c3a8ff; --l7:#8fe3ff;
  --shadow:0 12px 26px rgba(20,70,130,.18);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100%; color:var(--ink); font-family:'Nunito','Trebuchet MS',system-ui,sans-serif; font-weight:800; line-height:1.35;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 45%,#f2fbff 100%); background-attachment:fixed; -webkit-tap-highlight-color:transparent;
}
button{ font:inherit; color:inherit; cursor:pointer; border:0; }
input{ font:inherit; color:inherit; }
:focus-visible{ outline:4px solid #ff8a3d; outline-offset:2px; }
.snow{ position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
.snow i{ position:absolute; top:-6vh; font-style:normal; color:#fff; text-shadow:0 0 8px rgba(120,190,255,.9); animation:fall linear infinite; opacity:.85; }
@keyframes fall{ to{ transform:translate3d(var(--dx,30px),108vh,0) rotate(360deg); } }
.top,main,.toast,.banner{ position:relative; z-index:2; }

/* верхняя панель */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; padding:8px 12px 10px; background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(214,238,255,.94)); backdrop-filter:blur(6px); box-shadow:0 6px 18px rgba(20,70,130,.2); border-bottom:3px solid #fff; }
.top .row{ display:flex; align-items:center; gap:8px; max-width:960px; margin:0 auto; flex-wrap:wrap; }
.top .row + .row{ margin-top:8px; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:8px 16px; min-height:44px; background:#fff; color:var(--on); border-radius:999px; box-shadow:0 4px 0 var(--edge); font-weight:900; font-size:1rem; white-space:nowrap; }
.chip:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--edge); }
.chip.off{ opacity:.6; }
.chip.stat{ cursor:default; background:var(--warn); }
.chip.fire{ background:#ffd9c7; cursor:default; }
.stars.pop{ animation:starpop .45s ease; }
@keyframes starpop{ 50%{ transform:scale(1.25) rotate(-4deg); } }
.panel{ max-width:960px; margin:10px auto 0; padding:10px 14px; background:var(--card); border-radius:18px; display:grid; gap:6px; box-shadow:var(--shadow); }
.panel[hidden]{ display:none; }
.vol{ display:flex; align-items:center; gap:10px; font-size:1rem; font-weight:900; }
.vol span.l{ min-width:130px; }
.vol output{ min-width:3.4ch; text-align:right; }
input[type=range]{ flex:1; min-width:80px; accent-color:var(--accent); height:30px; }
main{ max-width:960px; margin:0 auto; padding:16px 14px 56px; }
h1{ margin:4px 0 6px; font-family:'Comfortaa','Nunito',sans-serif; font-size:clamp(1.9rem,5.4vw,3rem); line-height:1.08; font-weight:700; }
.sub{ margin:0 0 6px; color:var(--muted); font-weight:800; font-size:clamp(1.05rem,2.6vw,1.3rem); }
.lead{ margin:0 0 14px; color:var(--muted); font-weight:800; max-width:60ch; }

/* карта */
.hero{ text-align:center; padding:6px 0 8px; }
.heroes{ display:flex; align-items:center; justify-content:center; gap:10px; }
.heroes h1{ font-size:clamp(2.2rem,7vw,3.6rem); letter-spacing:.03em; margin:0; color:#0d4aa6; text-shadow:0 3px 0 #fff, 0 0 22px rgba(90,170,255,.8); }
.hchar{ font-size:clamp(2.6rem,10vw,4.6rem); animation:bob 3s ease-in-out infinite; filter:drop-shadow(0 6px 8px rgba(20,70,130,.3)); }
.hchar.b{ animation-delay:-1.5s; }
@keyframes bob{ 50%{ transform:translateY(-10px) rotate(4deg); } }
.progress{ display:flex; align-items:center; gap:10px; max-width:460px; margin:10px auto 18px; font-size:.95rem; color:var(--ink); font-weight:900; }
.pbar{ flex:1; height:18px; background:#fff; border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 5px rgba(20,70,130,.3); }
.pbar i{ display:block; height:100%; background:linear-gradient(90deg,#6ed0ff,#b9a6ff); border-radius:999px; transition:width .6s; }
.islands{ display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
@media (min-width:700px){ .islands{ grid-template-columns:repeat(3,1fr); gap:22px; } }
.island{ --c:var(--l1); position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:30px 10px 14px; min-height:180px; text-align:center; color:var(--on);
  background:linear-gradient(170deg,#fff,color-mix(in srgb,var(--c) 55%,#e6f6ff)); border-radius:30px; border:3px solid #fff;
  box-shadow:0 8px 0 color-mix(in srgb,var(--c) 75%,#2a5ca8), 0 16px 26px rgba(20,70,130,.22), inset 0 0 22px rgba(255,255,255,.9); transition:transform .15s; overflow:hidden; }
.island::before{ content:''; position:absolute; left:-4px; right:-4px; top:-4px; height:26px;
  background:radial-gradient(circle at 12% 0,#fff 0 16px,transparent 17px),radial-gradient(circle at 34% -2px,#fff 0 19px,transparent 20px),radial-gradient(circle at 58% 0,#fff 0 17px,transparent 18px),radial-gradient(circle at 82% -2px,#fff 0 19px,transparent 20px),radial-gradient(circle at 100% 0,#fff 0 14px,transparent 15px); }
.island:nth-child(even){ transform:translateY(12px); }
.island:active{ transform:translateY(8px); }
.island .em{ font-size:2.4rem; line-height:1; }
.island .num{ width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:#fff; color:var(--on); font-size:1.5rem; font-weight:900; box-shadow:0 3px 0 rgba(20,70,130,.3); }
.island b{ font-size:clamp(1.05rem,2.8vw,1.3rem); line-height:1.15; }
.island small{ color:var(--ink); font-weight:800; font-size:.92rem; opacity:.85; }
.island .done{ position:absolute; top:16px; right:12px; font-size:1.4rem; }
.big{ display:flex; align-items:center; justify-content:center; gap:12px; width:100%; margin-top:26px; padding:18px; font-size:clamp(1.3rem,4vw,1.8rem); font-weight:900; color:var(--on); text-align:left;
  background:linear-gradient(180deg,#fff2a6,#ffcf4d); border-radius:28px; border:3px solid #fff; box-shadow:0 8px 0 #d99a14, var(--shadow); }
.big.duelb{ background:linear-gradient(180deg,#d9f1ff,#79c4ff); box-shadow:0 8px 0 #3b87c9, var(--shadow); margin-top:18px; }
.big:active{ transform:translateY(6px); }
.big small{ display:block; font-size:.85rem; font-weight:800; opacity:.85; }
.reset{ display:block; margin:24px auto 0; padding:10px 18px; background:rgba(255,255,255,.7); color:var(--ink); font-size:1rem; border-radius:999px; }

/* экран уровня */
.lvhead{ --c:var(--l1); display:flex; align-items:center; gap:14px; padding:16px; border-radius:26px; background:linear-gradient(170deg,#fff,color-mix(in srgb,var(--c) 60%,#e6f6ff)); border:3px solid #fff; box-shadow:0 6px 0 color-mix(in srgb,var(--c) 75%,#2a5ca8), var(--shadow); margin-bottom:16px; color:var(--on); }
.lvhead .em{ font-size:2.8rem; }
.lvhead h1{ font-size:clamp(1.5rem,4.6vw,2.2rem); margin:0; }
.intro{ background:var(--card); border-radius:22px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:16px; font-weight:800; font-size:1.1rem; border:3px solid #fff; }
.intro h3{ margin:0 0 8px; font-size:1.2rem; }
.tbl{ display:grid; gap:6px; margin-top:8px; }
.tbl .r{ display:grid; grid-template-columns:76px 1fr auto; gap:10px; align-items:center; padding:8px 12px; background:color-mix(in srgb,var(--bg) 70%,#fff); border-radius:14px; font-size:1.35rem; }
.tbl .r b{ color:#0d4aa6; font-size:1.1rem; }
.tbl .r i{ font-style:normal; font-size:.82em; color:var(--muted); }
.tbl .help{ padding:4px 14px; border-radius:999px; background:#fff3b8; color:var(--on); font-size:1.05rem; box-shadow:0 3px 0 #e0c24c; }
.tbl em{ font-style:normal; color:#d12f1a; font-weight:900; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:3px; }
.stages{ display:grid; gap:12px; }
.stage{ --c:var(--l1); display:flex; align-items:center; gap:14px; width:100%; padding:14px 16px; text-align:left; background:#fff; color:var(--on); border-radius:24px; box-shadow:0 6px 0 var(--edge), var(--shadow); min-height:78px; }
.stage:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--edge); }
.stage .n{ flex:none; width:48px; height:48px; display:grid; place-items:center; border-radius:50%; background:var(--c); font-size:1.4rem; font-weight:900; }
.stage b{ display:block; font-size:1.25rem; line-height:1.2; }
.stage small{ color:var(--muted); font-weight:800; font-size:.95rem; }
.stage .ck{ margin-left:auto; font-size:1.6rem; }

/* задание */
.hud{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:1rem; color:var(--ink); font-weight:900; flex-wrap:wrap; }
.back{ padding:8px 14px; background:#fff; color:var(--on); border-radius:999px; box-shadow:0 3px 0 var(--edge); font-size:.95rem; font-weight:900; }
.bar{ height:16px; margin:8px 0 12px; border-radius:999px; background:#fff; box-shadow:inset 0 2px 5px rgba(20,70,130,.3); overflow:hidden; }
.bar i{ display:block; height:100%; background:linear-gradient(90deg,#6ed0ff,#b9a6ff); border-radius:999px; transition:width .5s; }
.mascots{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.mascot{ font-size:clamp(2.6rem,9vw,4rem); filter:drop-shadow(0 5px 6px rgba(20,70,130,.3)); transform-origin:50% 90%; }
.mascot.cheer{ animation:cheer .9s ease; } .mascot.oops{ animation:oops .6s ease; }
@keyframes cheer{ 30%{ transform:translateY(-22px) rotate(-8deg) scale(1.15); } 60%{ transform:translateY(0) rotate(6deg); } }
@keyframes oops{ 25%{ transform:rotate(-14deg); } 55%{ transform:rotate(12deg); } 80%{ transform:rotate(-6deg); } }
.prompt{ flex:1; margin:0; font-size:clamp(1.5rem,4.6vw,2.3rem); font-weight:900; line-height:1.15; text-align:center; color:#0b3f95; text-shadow:0 2px 0 #fff; }
.bigword{ margin:8px 0 12px; text-align:center; font-size:clamp(2.2rem,9vw,3.8rem); font-weight:900; line-height:1.15; color:var(--ink); }
.bigword small{ display:block; font-size:.42em; color:var(--muted); font-weight:800; }
.sentence{ margin:10px 0 14px; font-size:clamp(1.7rem,5.2vw,2.5rem); line-height:1.5; font-weight:900; color:var(--ink); }
.mk{ padding:2px 12px; border-radius:14px; background:#fff0a6; color:var(--on); }
.mk.on{ box-shadow:0 0 0 4px #ff8a3d; }
.mk.bad{ background:var(--bad); color:var(--on); text-decoration:line-through; text-decoration-color:#d12f1a; text-decoration-thickness:4px; }
.mk.good{ background:var(--good); color:var(--on); animation:pop .4s ease; }
.blank{ display:inline-block; min-width:4.5ch; border-bottom:6px dashed #ff8a3d; }
@keyframes pop{ 50%{ transform:scale(1.15); } }
.note{ display:inline-block; margin:0 0 8px; padding:6px 16px; background:#fff; color:var(--ink); border-radius:999px; box-shadow:0 3px 0 var(--edge); font-size:1.1rem; }
.ask{ margin:8px 0 6px; font-size:clamp(1.2rem,3.4vw,1.55rem); color:var(--ink); font-weight:900; }

/* снежные шары */
.opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); gap:16px; margin-top:12px; }
.opts.six{ grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr)); }
.opt,.dcard{ color:var(--on); font-weight:900; line-height:1.15; border:3px solid #fff; border-radius:999px;
  background:radial-gradient(circle at 30% 24%,#fff 0 18%,#eef8ff 40%,#cfe6fa 75%,#a9ccf0 100%);
  box-shadow:inset -10px -12px 18px rgba(90,150,215,.38), inset 6px 6px 12px rgba(255,255,255,.9), 0 9px 0 #8fbbe3, 0 16px 22px rgba(20,70,130,.28); }
.opt{ min-height:92px; padding:14px 18px; font-size:clamp(1.45rem,4.4vw,2.05rem); }
.opt small{ display:block; margin-top:2px; font-size:.6em; color:#1d3f70; font-weight:800; }
.opt.q,.dcard.q{ text-transform:uppercase; letter-spacing:.01em; }
.opt:active:not(:disabled){ transform:translateY(6px); box-shadow:inset -10px -12px 18px rgba(90,150,215,.38), 0 3px 0 #8fbbe3; }
.opt.ok{ background:radial-gradient(circle at 30% 24%,#fff 0 14%,#c8ffe6 40%,#6eeab4 100%); animation:pop .45s ease; }
.opt.no{ background:radial-gradient(circle at 30% 24%,#fff 0 14%,#ffe3ea 40%,#ff9db6 100%); animation:wob .45s ease; }
.opt:disabled{ cursor:default; }
.hintrow{ display:flex; justify-content:center; margin-top:24px; }
.btn{ padding:14px 26px; min-height:56px; background:linear-gradient(180deg,#a5dcff,#4aa8f5); color:var(--on); font-weight:900; font-size:1.2rem; border-radius:20px; border:3px solid #fff; box-shadow:0 6px 0 #2b78bd, 0 12px 18px rgba(20,70,130,.25); }
.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #2b78bd; }
.btn.hint{ background:linear-gradient(180deg,#fff2a6,#ffcf4d); box-shadow:0 6px 0 #d99a14; }
.btn.alt{ background:#fff; box-shadow:0 6px 0 var(--edge); }
.btn.go{ background:linear-gradient(180deg,#b9ffe0,#4fdca0); box-shadow:0 6px 0 #26a374; }
.hintbox{ margin:14px auto 0; padding:14px 18px; max-width:680px; background:#fff; color:var(--on); border-radius:20px; box-shadow:var(--shadow); font-weight:900; font-size:1.2rem; animation:pop .35s ease; border:3px solid #ffd45c; }
.hintbox[hidden]{ display:none; }

/* перетаскивание */
.pool{ display:flex; flex-wrap:wrap; justify-content:center; gap:16px; min-height:90px; margin:18px 0 6px; padding:16px; background:rgba(255,255,255,.5); border:3px dashed #7eb2e2; border-radius:26px; }
.pool:empty{ display:none; }
.dcard{ position:relative; z-index:5; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 26px; min-width:104px; min-height:96px; font-size:clamp(1.45rem,4.2vw,2.05rem); touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; }
.dcard span{ display:block; }
.dcard small{ font-size:.6em; color:#1d3f70; font-weight:800; }
.dcard.dragging{ z-index:40; cursor:grabbing; box-shadow:inset -10px -12px 18px rgba(90,150,215,.38), 0 22px 0 rgba(0,0,0,.08), 0 26px 30px rgba(20,70,130,.35); }
.dcard.sel{ outline:5px solid #ff8a3d; outline-offset:3px; }
.dcard.placed{ cursor:default; min-height:60px; min-width:0; padding:8px 18px; font-size:clamp(1.25rem,3.6vw,1.7rem); box-shadow:inset -6px -8px 12px rgba(90,150,215,.35), 0 4px 0 #8fbbe3; touch-action:auto; background:radial-gradient(circle at 30% 24%,#fff 0 14%,#c8ffe6 45%,#7cecbc 100%); }
.dcard.gone{ display:none; }
.slot{ position:relative; min-height:72px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; padding:6px; background:rgba(255,255,255,.85); border:4px dashed #6fa6dc; border-radius:22px; transition:transform .15s, border-color .15s; }
.slot .ph{ color:var(--muted); font-size:1.1rem; font-weight:800; }
.slot.filled .ph{ display:none; }
.slot.filled{ border-style:solid; border-color:#37d08f; }
.slot.over{ transform:scale(1.05); border-color:#ff8a3d; background:#fff6c9; }
.slot.bad{ animation:wob .45s ease; border-color:#e0452f; }
.slot.good{ animation:pop .4s ease; }
@keyframes wob{ 20%{ transform:translateX(-8px); } 40%{ transform:translateX(8px); } 60%{ transform:translateX(-5px); } 80%{ transform:translateX(4px); } }
.order{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.order .slotwrap{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.order .num{ width:38px; height:38px; display:grid; place-items:center; border-radius:50%; background:var(--warn); color:var(--on); font-weight:900; font-size:1.2rem; }
.order .slot{ width:100%; min-height:100px; }
.pairs{ display:grid; gap:12px; }
.pair{ display:grid; grid-template-columns:minmax(170px,46%) 1fr; gap:12px; align-items:center; }
.plabel{ display:flex; align-items:center; gap:10px; padding:8px 12px; background:#fff; color:var(--on); border-radius:18px; box-shadow:0 4px 0 var(--edge); text-align:left; }
.plabel .pa{ flex:none; min-width:3.4ch; font-size:1.7rem; line-height:1; font-weight:900; }
.plabel .pt{ font-size:1.05rem; line-height:1.25; color:#1d3f70; font-weight:800; }
.pair .slot{ min-height:64px; }
.chain{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.chain .slot,.chain .fixed{ width:min(100%,460px); }
.row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; }
.row .slot{ min-width:150px; }
.fixed{ padding:12px 20px; text-align:center; background:linear-gradient(180deg,#bfe4ff,#7cc2ff); color:var(--on); border-radius:20px; box-shadow:0 5px 0 #3b87c9; font-size:1.6rem; font-weight:900; }
.fixed small{ display:block; font-size:.6em; font-weight:800; }
.arrow{ font-size:1.4rem; line-height:1; }
.cats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:14px; }
.bin{ flex-direction:column; justify-content:flex-start; align-items:stretch; min-height:170px; padding:8px; }
.binhead{ text-align:center; font-weight:900; font-size:1.2rem; line-height:1.15; padding:8px; border-radius:14px; background:#d3eaff; color:var(--on); }
.binhead small{ display:block; font-size:.7em; color:#1d3f70; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding-top:8px; }

/* карточки сбоку от падежей (чтобы не листать вниз) */
.sortbox{ container-type:inline-size; }
.sortwrap{ display:grid; grid-template-columns:1fr; gap:14px; }
.sortmain{ position:relative; z-index:1; min-width:0; }
.sortwrap .pool{ position:relative; z-index:6; margin:12px 0 0; }
@container (min-width:400px){
  .sortbox .sortwrap{ grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); align-items:start; gap:14px; }
  .sortbox .sortwrap .pool{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin:0; padding:10px; position:sticky; top:calc(env(safe-area-inset-top,0px) + 112px); }
  .sortbox .sortwrap .dcard{ min-width:0; width:100%; padding:8px 10px; min-height:62px; font-size:clamp(1.2rem,2.3vw,1.7rem); overflow-wrap:anywhere; text-align:center; }
  .sortbox .sortwrap .dcard.placed{ width:auto; min-height:44px; padding:6px 12px; }
  .sortbox .sortwrap .order{ grid-template-columns:repeat(2,1fr); }
  .sortbox .sortwrap .pair{ grid-template-columns:minmax(170px,46%) 1fr; }
  .sortbox .sortwrap .row .slot{ min-width:110px; }
}
/* итоги */
.result{ text-align:center; padding-top:12px; }
.zoom{ animation:zoomin 1.6s ease both; }
@keyframes zoomin{ from{ transform:scale(.5); opacity:0; } 45%{ transform:scale(1.18); opacity:1; } to{ transform:scale(1); } }
.bigstars{ font-size:3.4rem; letter-spacing:.1em; margin:8px 0 14px; }
.bigstars span{ display:inline-block; animation:starin .5s both; }
.bigstars span:nth-child(2){ animation-delay:.2s; } .bigstars span:nth-child(3){ animation-delay:.4s; }
@keyframes starin{ from{ transform:scale(0) rotate(-90deg); } 70%{ transform:scale(1.4) rotate(10deg); } }
.stats{ display:inline-grid; gap:8px; margin:6px 0 20px; text-align:left; font-size:1.3rem; }
.actions{ display:grid; gap:14px; max-width:380px; margin:0 auto; }

/* моя практика */
.panelbox{ background:var(--card); border-radius:24px; padding:16px; box-shadow:var(--shadow); margin-bottom:16px; display:grid; gap:12px; border:3px solid #fff; }
.field{ display:grid; gap:4px; font-size:1.05rem; color:var(--ink); font-weight:900; }
.in{ width:100%; padding:12px 14px; font-size:1.4rem; font-weight:800; background:#fff; color:var(--on); border:3px solid #9cc4ea; border-radius:16px; }
.seg{ display:flex; flex-wrap:wrap; gap:8px; }
.seg .chip.on{ background:var(--good); }
.words{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ================= АУДИО (Web Audio API) ================= */
const Snd = (() => {
  const KEY = 'padezhi-quest-audio-v1';

  function tone(f, t0, d, o = {}) {
    const { type = 'sine', v = 0.3, to = null, a = 0.008, out = sfx } = o;
    const osc = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + t0;

  }
  function noise(t0, d, o = {}) {
    const { f0 = 400, f1 = 2000, v = 0.12, q = 0.8 } = o;
    const len = Math.max(1, Math.floor(ctx.sampleRate * d)), buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);

  const safe = fn => (...a) => { if (!go()) return; try { fn(...a); } catch (e) {} };
  const playClick = safe(() => tone(640, 0, 0.07, { v:0.26, to:430 }));
  const playDrag = safe(() => noise(0, 0.17, { f0:300, f1:1800, v:0.1 }));
  const playDrop = safe(() => tone(360, 0, 0.1, { v:0.32, to:190 }));
  const playPlace = safe(() => { tone(880, 0.05, 0.1, { type:'triangle', v:0.2 }); tone(1175, 0.12, 0.14, { type:'triangle', v:0.2 }); });
  const playCorrect = safe(() => {
    tone(784, 0, 0.24, { type:'triangle', v:0.3 }); tone(1568, 0, 0.12, { v:0.07 });
    tone(1047, 0.12, 0.28, { type:'triangle', v:0.3 }); tone(2093, 0.12, 0.14, { v:0.06 });
    tone(1319, 0.25, 0.45, { type:'triangle', v:0.3 }); tone(2637, 0.25, 0.2, { v:0.05 });
  });
  const playWrong = safe(() => { tone(310, 0, 0.14, { v:0.28, to:250 }); tone(270, 0.18, 0.2, { v:0.28, to:205 }); });
  const playHint = safe(() => { tone(1760, 0, 0.3, { v:0.2 }); tone(2637, 0, 0.2, { v:0.05 }); });
  const playStar = safe(() => { tone(1319, 0, 0.12, { v:0.18 }); tone(1760, 0.08, 0.14, { v:0.18 }); tone(2349, 0.16, 0.3, { v:0.16, type:'triangle' }); });
  const playCombo = safe(n => {
    if (n >= 10) { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.22, { type:'triangle', v:0.3 })); [1047, 1319, 1568].forEach(f => tone(f, 0.45, 0.6, { type:'triangle', v:0.2 })); noise(0.4, 0.5, { f0:3000, f1:7000, v:0.05 }); }
    else if (n >= 5) { [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, i * 0.06, 0.2, { type:'triangle', v:0.26 })); noise(0.25, 0.3, { f0:3000, f1:6500, v:0.04 }); }
    else [1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.07, 0.2, { type:'triangle', v:0.26 }));
  });
  const playStageComplete = safe(() => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.25, { type:'triangle', v:0.28 })); tone(1319, 0.45, 0.5, { type:'triangle', v:0.25 }); tone(1047, 0.45, 0.5, { v:0.12 }); });
  const playLevelComplete = safe(() => { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.12, 0.26, { type:'triangle', v:0.28 })); [1047, 1319, 1568].forEach(f => tone(f, 0.9, 0.7, { type:'triangle', v:0.2 })); noise(0.85, 0.5, { f0:3000, f1:7000, v:0.05 }); });
  const playFinalVictory = safe(() => {
    [[392,0,.14],[392,.16,.14],[392,.32,.14],[523,.5,.4],[440,.95,.14],[523,1.12,.55],[659,1.7,.7]].forEach(([f, t, d]) => { tone(f, t, d, { type:'triangle', v:0.3 }); tone(f * 2, t, d, { v:0.05 }); });
    [523, 659, 784, 1047].forEach(f => tone(f, 1.7, 1.1, { type:'triangle', v:0.18 })); noise(1.6, 0.9, { f0:3000, f1:8000, v:0.05 });
  });
  const playThrow = safe(() => { noise(0, 0.28, { f0:500, f1:2600, v:0.14 }); tone(520, 0, 0.25, { v:0.12, to:900 }); });
  const playHit = safe(() => { tone(170, 0, 0.18, { v:0.4, to:60 }); noise(0, 0.14, { f0:900, f1:300, v:0.16 }); });
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const MEL = [[64,1],[67,1],[69,1],[67,1],[64,1],[62,1],[60,2],[64,1],[67,1],[64,1],[62,1],[60,1],[62,1],[60,2]];

    mRunning = false; clearTimeout(mTimer);

  return { S, save, ensure, applyVols, startMusic, stopMusic, playClick, playDrag, playDrop, playPlace, playCorrect, playWrong, playHint, playStar, playCombo, playStageComplete, playLevelComplete, playFinalVictory, playThrow, playHit };
})();

function syncAudioUI() {
  const S = Snd.S;
  $('#soundBtn').textContent = S.on ? '🔊 Звук' : '🔇 Звук выкл'; $('#soundBtn').classList.toggle('off', !S.on); $('#soundBtn').setAttribute('aria-pressed', String(S.on));

  $('#masterVol').value = S.master; $('#masterOut').textContent = S.master + '%';
  $('#sfxVol').value = S.sfx; $('#sfxOut').textContent = S.sfx + '%';
  $('#musVol').value = S.music; $('#musOut').textContent = S.music + '%';
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, function unlock() {
  Snd.ensure(); if (Snd.S.musicOn) Snd.startMusic();
  ['pointerdown', 'keydown', 'touchstart'].forEach(e2 => window.removeEventListener(e2, unlock, true));
}, true));
$('#soundBtn').addEventListener('click', () => {
  Snd.S.on = !Snd.S.on; Snd.save(); Snd.ensure(); Snd.applyVols();

});
$('#musicBtn').addEventListener('click', () => {
  Snd.S.musicOn = !Snd.S.musicOn;
  if (Snd.S.musicOn && !Snd.S.on) { Snd.S.on = true; Snd.ensure(); Snd.applyVols(); }

[['#masterVol', 'master'], ['#sfxVol', 'sfx'], ['#musVol', 'music']].forEach(([sel, key]) => {

const prefO = f => /^[аоуиэ]/i.test(f) ? 'об' : 'о';
const withPrep = forms => forms.map((f, i) => i === 5 ? prefO(f) + ' ' + f : f);
function nounForms(word, g, an) {
  const w = word.trim().toLowerCase(); if (!w) return null;
  const L = w.slice(-1), st = w.slice(0, -1); let f = null;
  if ((g === 'м' || g === 'ж') && (L === 'а' || L === 'я')) {
    if (w.endsWith('ия')) f = [w, st + 'и', st + 'и', st + 'ю', st + 'ей', st + 'и'];
    else if (L === 'а') { const e = st.slice(-1); f = [w, st + ('жшчщгкх'.includes(e) ? 'и' : 'ы'), st + 'е', st + 'у', st + ('жшчщц'.includes(e) ? 'ей' : 'ой'), st + 'е']; }
    else f = [w, st + 'и', st + 'е', st + 'ю', st + 'ей', st + 'е'];
  } else if (g === 'м') {
    if (L === 'й') { f = [w, st + 'я', st + 'ю', null, st + 'ем', st + (w.endsWith('ий') ? 'и' : 'е')]; f[3] = an ? f[1] : w; }
    else if (L === 'ь') { f = [w, st + 'я', st + 'ю', null, st + 'ем', st + 'е']; f[3] = an ? f[1] : w; }
    else if ('аеёиоуыэюя'.includes(L)) return null;
    else { f = [w, w + 'а', w + 'у', null, w + 'ом', w + 'е']; f[3] = an ? f[1] : w; }
  } else if (g === 'ж') { if (L === 'ь') f = [w, st + 'и', st + 'и', w, st + 'ью', st + 'и']; else return null; }
  else if (g === 'с') {
    if (w.endsWith('ие')) f = [w, st + 'я', st + 'ю', w, st + 'ем', st + 'и'];
    else if (L === 'о') f = [w, st + 'а', st + 'у', w, st + 'ом', st + 'е'];
    else if (L === 'е') f = [w, st + 'я', st + 'ю', w, st + 'ем', st + 'е'];
    else return null;
  }
  return f;
}
function adjForms(adj, an) {
  const a = adj.trim().toLowerCase(), E = a.slice(-2), s = a.slice(0, -2), sv = /[жшчщгкх]$/.test(s);
  if (E === 'ый' || E === 'ой') { const f = [a, s + 'ого', s + 'ому', null, s + (sv ? 'им' : 'ым'), s + 'ом']; f[3] = an ? f[1] : a; return f; }
  if (E === 'ий') { const h = /[кгх]$/.test(s); const f = [a, s + (h ? 'ого' : 'его'), s + (h ? 'ому' : 'ему'), null, s + 'им', s + (h ? 'ом' : 'ем')]; f[3] = an ? f[1] : a; return f; }
  if (E === 'ая') return [a, s + 'ой', s + 'ой', s + 'ую', s + 'ой', s + 'ой'];
  if (E === 'яя') return [a, s + 'ей', s + 'ей', s + 'юю', s + 'ей', s + 'ей'];
  if (E === 'ое') return [a, s + 'ого', s + 'ому', a, s + (sv ? 'им' : 'ым'), s + 'ом'];
  if (E === 'ее') return [a, s + 'его', s + 'ему', a, s + 'им', s + 'ем'];
  return null;
}
const phraseRaw = (adj, noun, g, an) => { const a = adjForms(adj, an), n = nounForms(noun, g, an); return a && n ? a.map((x, i) => x + ' ' + n[i]) : null; };
const nounFull = (noun, g, an) => withPrep(nounForms(noun, g, an));
const phraseFull = (adj, noun, g, an) => withPrep(phraseRaw(adj, noun, g, an));
function hl(base, form) {           // подчёркнуть окончания
  const bw = base.split(' '), fw = form.split(' ');
  return fw.map((w, k) => { const b = bw[bw.length - fw.length + k] || bw[k] || ''; let i = 0; while (i < w.length && i < b.length && w[i] === b[i]) i++; return w.slice(0, i) + (i < w.length ? `<em>${w.slice(i)}</em>` : ''); }).join(' ');
}

/* Двое играют одновременно: при двух пальцах браузер не присылает click, поэтому по каждому касанию вызываем click сами */
(function multiTouch() {
  const down = new Map(), recent = [], sel = 'button, .opt, .slot';
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    const b = e.target.closest && e.target.closest(sel); if (b && !b.disabled) down.set(e.pointerId, { b, x:e.clientX, y:e.clientY });
  }, true);
  document.addEventListener('pointercancel', e => down.delete(e.pointerId), true);
  document.addEventListener('pointerup', e => {
    const r = down.get(e.pointerId); if (!r) return; down.delete(e.pointerId);
    if (Math.hypot(e.clientX - r.x, e.clientY - r.y) > 16 || !document.contains(r.b) || r.b.disabled) return;
    recent.push({ t:performance.now(), x:e.clientX, y:e.clientY }); if (recent.length > 8) recent.shift();
    r.b.click();
  }, true);
  document.addEventListener('click', e => {      // настоящий click, который браузер пришлёт следом, гасим: мы уже обработали касание
    if (!e.isTrusted) return; const now = performance.now();
    if (recent.some(s => now - s.t < 700 && Math.hypot(e.clientX - s.x, e.clientY - s.y) < 40)) { e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);
})();
